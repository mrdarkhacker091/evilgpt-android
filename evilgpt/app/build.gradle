plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('KEYSTORE_PATH')
def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def canSignRelease = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.evilgpt.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.evilgpt.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    if (canSignRelease) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
